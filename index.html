<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>雙側邊轉動與三角形示範（極限防超界與大數值修正版）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f5f9;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin: 2px 0;
        }
        canvas {
            background-color: #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
            border-radius: 8px;
            cursor: crosshair;
            display: block;
            width: 95vw;
            max-width: 1300px;
            flex-grow: 1;
            margin: 5px 0;
        }
        .control-panel {
            background: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            font-size: 16px;
            margin-bottom: 5px;
        }
        .control-panel label {
            margin: 0 8px;
            font-weight: bold;
        }
        .control-panel input {
            width: 75px;
            padding: 5px;
            font-size: 16px;
            text-align: center;
            margin-left: 5px;
        }
        .control-panel button {
            padding: 6px 16px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .control-panel button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>雙側邊轉動與三角形示範</h1>
    
    <canvas id="canvas"></canvas>

    <div class="control-panel">
        <label style="color: #2980b9;">底邊 c: <input type="number" id="inputC" value="15" min="1"></label>
        <label style="color: #27ae60;">左側邊 b: <input type="number" id="inputB" value="10" min="1"></label>
        <label style="color: #e67e22;">右側邊 a: <input type="number" id="inputA" value="8" min="1"></label>
        <button onclick="initSides()">設定邊長</button>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let c_len = 15; 
let b_len = 10; 
let a_len = 8;  

const colorAB = '#2980b9'; 
const colorAC = '#27ae60'; 
const colorBD = '#e67e22'; 

let A = { x: 0, y: 0 };
let B = { x: 0, y: 0 };

let thetaC = -Math.PI / 4; 
let thetaD = -3 * Math.PI / 4; 

let isSnapped = false;
let draggingPoint = null; 

function updateCanvasSize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}

// 更加嚴謹的動態縮放：預留足夠頂部與左右邊距，確保大數字打直也絕不超出畫面
function getDynamicScale() {
    updateCanvasSize();
    let maxW = c_len + b_len + a_len; 
    let maxH = b_len + a_len;          

    let scaleX = (canvas.width - 140) / maxW;
    let scaleY = (canvas.height - 140) / maxH;
    return Math.max(2, Math.min(scaleX, scaleY));
}

function initSides() {
    c_len = parseFloat(document.getElementById('inputC').value);
    b_len = parseFloat(document.getElementById('inputB').value);
    a_len = parseFloat(document.getElementById('inputA').value);

    if (isNaN(c_len) || isNaN(b_len) || isNaN(a_len) || c_len <= 0 || b_len <= 0 || a_len <= 0) {
        alert('請輸入大於 0 的有效數字！');
        return;
    }

    thetaC = -Math.PI / 3;
    thetaD = -2 * Math.PI / 3;
    isSnapped = false;

    draw();
}

function solveTriangleAngles(a, b, c) {
    let cosC = (a*a + b*b - c*c) / (2 * a * b);
    cosC = Math.max(-1, Math.min(1, cosC));
    let angleC = Math.acos(cosC);

    let cosA = (b*b + c*c - a*a) / (2 * b * c);
    cosA = Math.max(-1, Math.min(1, cosA));
    let angleA = Math.acos(cosA);

    return { angleA, angleC };
}

function draw() {
    let SCALE = getDynamicScale();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let totalWidthPx = c_len * SCALE;
    
    // 底邊置中，位置稍微偏下方（距離底部 100 像素）
    let startX = (canvas.width - totalWidthPx) / 2;
    let startY = canvas.height - 100; 

    A.x = startX;
    A.y = startY;
    B.x = startX + totalWidthPx;
    B.y = startY;

    const isValid = (b_len + a_len > c_len);

    let C = {
        x: A.x + b_len * SCALE * Math.cos(thetaC),
        y: A.y + b_len * SCALE * Math.sin(thetaC)
    };

    let D = {
        x: B.x + a_len * SCALE * Math.cos(thetaD),
        y: B.y + a_len * SCALE * Math.sin(thetaD)
    };

    if (isSnapped && isValid) {
        let sol = solveTriangleAngles(a_len, b_len, c_len);
        thetaC = -sol.angleA;
        C.x = A.x + b_len * SCALE * Math.cos(thetaC);
        C.y = A.y + b_len * SCALE * Math.sin(thetaC);

        D.x = C.x;
        D.y = C.y;
        thetaD = Math.atan2(D.y - B.y, D.x - B.x);
    } else {
        let dist = Math.hypot(C.x - D.x, C.y - D.y);
        let snapThreshold = Math.max(35, SCALE * 1.5);
        if (dist < snapThreshold && isValid && draggingPoint === null) {
            isSnapped = true;
            let sol = solveTriangleAngles(a_len, b_len, c_len);
            thetaC = -sol.angleA;
            C.x = A.x + b_len * SCALE * Math.cos(thetaC);
            C.y = A.y + b_len * SCALE * Math.sin(thetaC);
            D.x = C.x;
            D.y = C.y;
            thetaD = Math.atan2(D.y - B.y, D.x - B.x);
        }
    }

    let distCD = Math.hypot(C.x - D.x, C.y - D.y) / SCALE;
    let isConnected = (isSnapped || distCD < 1.0); 

    if (isConnected && isValid) {
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.lineTo(B.x, B.y);
        ctx.lineTo(C.x, C.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 152, 219, 0.15)';
        ctx.fill();
    }

    let lineWidth = Math.max(4, Math.min(12, SCALE * 0.15));

    // 1. 底邊 c
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.strokeStyle = colorAB;
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    // 2. 左側邊 b
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(C.x, C.y);
    ctx.strokeStyle = colorAC;
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    // 3. 右側邊 a
    ctx.beginPath();
    ctx.moveTo(B.x, B.y);
    ctx.lineTo(D.x, D.y);
    ctx.strokeStyle = colorBD;
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    let fontSize = Math.max(16, Math.min(34, SCALE * 0.4));
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.textBaseline = 'middle';
    
    // 底邊標籤
    ctx.textAlign = 'center';
    let midAB = { x: (A.x + B.x) / 2, y: A.y + fontSize * 1.3 };
    ctx.fillStyle = colorAB;
    ctx.fillText(`${c_len} 公分`, midAB.x, midAB.y);

    // 左側邊標籤
    ctx.textAlign = 'right';
    let midAC = { x: (A.x + C.x) / 2 - 15, y: (A.y + C.y) / 2 - 10 };
    ctx.fillStyle = colorAC;
    ctx.fillText(`${b_len} 公分`, midAC.x, midAC.y);

    // 右側邊標籤
    ctx.textAlign = 'left';
    let midBD = { x: (B.x + D.x) / 2 + 15, y: (B.y + D.y) / 2 - 10 };
    ctx.fillStyle = colorBD;
    ctx.fillText(`${a_len} 公分`, midBD.x, midBD.y);
}

function handleTouchOrMouse(clientX, clientY) {
    let SCALE = getDynamicScale();
    const rect = canvas.getBoundingClientRect();
    let scaleFactor = canvas.width / rect.width;
    let mouseX = (clientX - rect.left) * scaleFactor;
    let mouseY = (clientY - rect.top) * scaleFactor;

    let C = {
        x: A.x + b_len * SCALE * Math.cos(thetaC),
        y: A.y + b_len * SCALE * Math.sin(thetaC)
    };
    let D = {
        x: B.x + a_len * SCALE * Math.cos(thetaD),
        y: B.y + a_len * SCALE * Math.sin(thetaD)
    };

    // 關鍵修正：確保即使數字大、畫面縮小，點擊判定範圍依然足夠大（至少 35 像素以上）
    let hitRadius = Math.max(35, b_len * SCALE * 0.2);

    if (Math.hypot(C.x - mouseX, C.y - mouseY) < hitRadius) {
        draggingPoint = 'C';
        isSnapped = false; 
    } else if (Math.hypot(D.x - mouseX, D.y - mouseY) < hitRadius) {
        draggingPoint = 'D';
        isSnapped = false; 
    }
}

canvas.addEventListener('mousedown', (e) => handleTouchOrMouse(e.clientX, e.clientY));
canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length > 0) handleTouchOrMouse(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

function moveHandler(clientX, clientY) {
    if (!draggingPoint) return;
    const rect = canvas.getBoundingClientRect();
    let scaleFactor = canvas.width / rect.width;
    let mouseX = (clientX - rect.left) * scaleFactor;
    let mouseY = (clientY - rect.top) * scaleFactor;

    if (draggingPoint === 'C') {
        thetaC = Math.atan2(mouseY - A.y, mouseX - A.x);
    } else if (draggingPoint === 'D') {
        thetaD = Math.atan2(mouseY - B.y, mouseX - B.x);
    }
    draw();
}

canvas.addEventListener('mousemove', (e) => moveHandler(e.clientX, e.clientY));
canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) moveHandler(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

window.addEventListener('mouseup', () => { draggingPoint = null; draw(); });
window.addEventListener('touchend', () => { draggingPoint = null; draw(); });

window.addEventListener('resize', () => {
    draw();
});

window.onload = () => {
    initSides();
};
</script>

</body>
</html>
